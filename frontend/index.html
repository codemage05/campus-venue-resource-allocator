<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Venue & Event Resource Allocator — Enterprise SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            background: #070b14;
            color: #e2e8f0;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.14), transparent),
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
        }

        .mono {
            font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        }

        input,
        select,
        textarea {
            background: #0b1220;
            border: 1px solid #334155;
            border-radius: 0.6rem;
            padding: 0.55rem 0.75rem;
            width: 100%;
            font-size: 0.875rem;
            color: #f8fafc;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25), inset 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        input[type=checkbox] {
            width: auto;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #070b14;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Same-origin when served by Flask (http://localhost:5000/), otherwise talk to the local Flask server.
        const API_BASE = window.location.protocol.startsWith('http') && window.location.port === '5000'
            ? `${window.location.origin}/api`
            : 'http://localhost:5000/api';

        /* ---------- Modern Lucide SVG Icons ---------- */
        const ICONS = {
            calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
            check: '<path d="M20 6 9 17l-5-5"/>',
            x: '<path d="M18 6 6 18M6 6l12 12"/>',
            alert: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3zM12 9v4M12 17h.01"/>',
            clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
            users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
            shield: '<path d="M20 13c0 5-3.5 7.5-7.7 8.9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>',
            kanban: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v10"/>',
            timeline: '<path d="M3 5h8M3 12h14M3 19h10"/>',
            term: '<path d="m4 17 6-6-6-6M12 19h8"/>',
            plus: '<path d="M5 12h14M12 5v14"/>',
            user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
            building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
            cpu: '<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
            trash: '<path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>',
            lock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
            unlock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
            search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
            filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
            sparkles: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>',
            refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
            arrowRight: '<path d="M5 12h14M12 5l7 7-7 7"/>',
            activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
            tag: '<path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><circle cx="7" cy="7" r=".5" fill="currentColor"/>',
        };
        const Icon = ({ n, s = 16, className = '' }) => (
            <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: ICONS[n] || '' }} />
        );

        /* ---------- Domain constants ---------- */
        const VENUES = [
            { id: 'aud', name: 'Main Auditorium', capacity: 400, color: 'indigo', equipment: ['Dual Projectors', 'Line-Array PA', '4 Wireless Mics'] },
            { id: 'sha', name: 'Seminar Hall A', capacity: 120, color: 'cyan', equipment: ['Smart Board', '2 Wireless Mics'] },
            { id: 'lab', name: 'CSE AI & Robotics Lab', capacity: 60, color: 'emerald', equipment: ['30 Workstations', '4K Display'] },
            { id: 'amp', name: 'Open Air Amphitheatre', capacity: 250, color: 'amber', equipment: ['Portable PA', 'Stage Lighting'] },
        ];
        const CLUBS = ['IEEE CS', 'Coding Club', 'Robotics Society', 'Cultural Club', 'Entrepreneurship Cell'];
        const ROLES = [
            { id: 'student', name: 'Student Coordinator', short: 'Student', icon: 'user', badge: 'Public Access', description: 'Drafts venue proposals & requests' },
            { id: 'faculty', name: 'Faculty Advisor', short: 'Faculty', icon: 'users', badge: 'Verified Access', description: 'Reviews academic suitability & approves slots' },
            { id: 'admin', name: 'Facilities Admin', short: 'Admin', icon: 'shield', badge: 'Full Authority', description: 'Final confirmation & campus allocation' },
        ];
        const ACTIVE = ['APPROVED_FACULTY', 'CONFIRMED'];
        const STATUS = {
            PENDING_FACULTY: { label: 'Pending Faculty', pill: 'bg-amber-500/20 text-amber-200 border-amber-500/50', bar: 'bg-amber-500/25 border-amber-400/70', head: 'text-amber-300', dot: 'bg-amber-400' },
            APPROVED_FACULTY: { label: 'Faculty Approved', pill: 'bg-cyan-500/20 text-cyan-200 border-cyan-500/50', bar: 'bg-cyan-500/25 border-cyan-400/70', head: 'text-cyan-300', dot: 'bg-cyan-400' },
            CONFIRMED: { label: 'Confirmed', pill: 'bg-emerald-500/20 text-emerald-200 border-emerald-500/50', bar: 'bg-emerald-500/25 border-emerald-400/70', head: 'text-emerald-300', dot: 'bg-emerald-400' },
            REJECTED: { label: 'Rejected', pill: 'bg-rose-500/20 text-rose-200 border-rose-500/50', bar: 'bg-rose-500/25 border-rose-400/60', head: 'text-rose-300', dot: 'bg-rose-400' },
        };
        const TRANSITIONS = {
            PENDING_FACULTY: { faculty: ['APPROVED_FACULTY', 'REJECTED'] },
            APPROVED_FACULTY: { admin: ['CONFIRMED', 'REJECTED'] },
        };
        const DAY_START = 8, DAY_END = 20;

        const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
        const iso = (d) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
        const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
        const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const venueOf = (id) => VENUES.find((v) => v.id === id) || VENUES[0];
        const TODAY = addDays(0), TOMORROW = addDays(1);

        const SEED = [
            { id: 101, title: 'AI Summit 2026', club: 'IEEE CS', venueId: 'aud', date: TODAY, start: '10:00', end: '13:00', attendees: 320, equip: ['Dual Projectors', 'Line-Array PA'], status: 'CONFIRMED', remark: 'Cleared. Keep aisles open.' },
            { id: 102, title: 'Hackathon Kickoff', club: 'Coding Club', venueId: 'sha', date: TODAY, start: '14:00', end: '17:00', attendees: 100, equip: ['Smart Board'], status: 'APPROVED_FACULTY', remark: 'Fine by me.' },
            { id: 103, title: 'Line Follower Workshop', club: 'Robotics Society', venueId: 'lab', date: TOMORROW, start: '11:00', end: '13:00', attendees: 45, equip: ['30 Workstations'], status: 'PENDING_FACULTY', remark: '' },
            { id: 104, title: 'Open Mic Night', club: 'Cultural Club', venueId: 'amp', date: TODAY, start: '18:00', end: '20:00', attendees: 240, equip: ['Portable PA', 'Stage Lighting'], status: 'REJECTED', remark: 'Clashes with the evening sports meet.' },
            { id: 105, title: 'Guest Lecture: LLM Systems', club: 'IEEE CS', venueId: 'aud', date: TOMORROW, start: '09:00', end: '11:00', attendees: 280, equip: ['Dual Projectors'], status: 'PENDING_FACULTY', remark: '' },
        ];
        const SEED_AUDIT = [
            { t: '9:05 AM', msg: 'Request #101 transitioned from APPROVED_FACULTY -> CONFIRMED by Facilities Admin' },
            { t: '8:40 AM', msg: 'Request #101 transitioned from PENDING_FACULTY -> APPROVED_FACULTY by Faculty Advisor' },
            { t: '8:10 AM', msg: 'Request #104 transitioned from PENDING_FACULTY -> REJECTED by Faculty Advisor' },
        ];
        const BLANK = { title: '', club: CLUBS[0], venueId: 'aud', date: TOMORROW, start: '14:00', end: '16:00', attendees: 100, equip: [] };

        /* ---------- Pure Validation Engine ---------- */
        const findConflicts = (d, list, ignoreId) => list.filter((b) =>
            b.id !== ignoreId && b.venueId === d.venueId && b.date === d.date && ACTIVE.includes(b.status) &&
            toMin(d.start) < toMin(b.end) && toMin(d.end) > toMin(b.start));

        const validate = (d, list) => {
            const issues = [], v = venueOf(d.venueId);
            if (!d.title.trim()) issues.push({ level: 'error', text: 'Event title is required.' });
            if (!d.start || !d.end || toMin(d.end) <= toMin(d.start))
                issues.push({ level: 'error', text: 'Chronological check failed: end time must be strictly after start time.' });
            if (Number(d.attendees) > v.capacity)
                issues.push({ level: 'error', text: `Capacity exceeded: ${d.attendees} attendees > ${v.name} max capacity (${v.capacity}).` });
            if (Number(d.attendees) < 1) issues.push({ level: 'error', text: 'Expected attendees must be at least 1.' });
            if (d.start && d.end && toMin(d.end) > toMin(d.start)) {
                const c = findConflicts(d, list);
                c.forEach((b) => issues.push({ level: 'error', text: `Time conflict with #${b.id} "${b.title}" (${b.start}-${b.end}, ${STATUS[b.status].label}) at ${v.name}.` }));
                list.filter((b) => b.venueId === d.venueId && b.date === d.date && b.status === 'PENDING_FACULTY' &&
                    toMin(d.start) < toMin(b.end) && toMin(d.end) > toMin(b.start))
                    .forEach((b) => issues.push({ level: 'warn', text: `Overlaps pending request #${b.id} "${b.title}". Whichever is approved first claims the slot.` }));
            }
            return issues;
        };

        /* ---------- Stable Presentational Atoms (High Elevation & Contrast) ---------- */
        const Pill = ({ s }) => (
            <span className={`text-xs font-semibold tracking-wide px-2.5 py-0.5 rounded-full border inline-flex items-center gap-1.5 shadow-sm ${STATUS[s].pill}`}>
                <span className={`w-1.5 h-1.5 rounded-full ${STATUS[s].dot}`} />
                {STATUS[s].label}
            </span>
        );

        const Card = ({ children, className = '' }) => (
            <div className={`bg-slate-900/90 backdrop-blur-md border border-slate-700/70 shadow-xl shadow-black/40 rounded-2xl ${className}`}>
                {children}
            </div>
        );

        const Field = ({ label, children, note }) => (
            <label className="block text-xs font-semibold text-slate-300 space-y-1.5">
                <div className="flex justify-between items-center">
                    <span>{label}</span>
                    {note && <span className="text-xs text-slate-400 font-normal">{note}</span>}
                </div>
                {children}
            </label>
        );

        /* =====================================================================
           MAIN APPLICATION COMPONENT
           ===================================================================== */
        function App() {
            const [role, setRole] = useState('student');
            const [auth, setAuth] = useState({ faculty: false, admin: false });
            const [authProfile, setAuthProfile] = useState({});
            const [loginModal, setLoginModal] = useState(null); // 'faculty' | 'admin' | null
            const [deleteModal, setDeleteModal] = useState(null); // booking object | null

            const [page, setPage] = useState('overview'); // 'overview' | 'schedule' | 'new-request' | 'audit'
            const [bookings, setBookings] = useState(SEED);
            const [audit, setAudit] = useState(SEED_AUDIT);
            const [conflictLog, setConflictLog] = useState([]);
            const [form, setForm] = useState(BLANK);

            // Filters for Schedule page
            const [scheduleView, setScheduleView] = useState('kanban'); // 'kanban' | 'timeline'
            const [searchQuery, setSearchQuery] = useState('');
            const [filterVenue, setFilterVenue] = useState('all');
            const [filterClub, setFilterClub] = useState('all');
            const [viewDate, setViewDate] = useState(TODAY);

            const [remarks, setRemarks] = useState({});
            const [notice, setNotice] = useState(null);
            const [online, setOnline] = useState(null);

            // Synchronize initial state from Flask API
            useEffect(() => {
                fetch(`${API_BASE}/state`)
                    .then((res) => res.ok ? res.json() : Promise.reject())
                    .then((data) => {
                        setBookings(data.bookings || []);
                        setAudit(data.audit || []);
                        setConflictLog(data.conflictLog || []);
                        setOnline(true);
                    })
                    .catch(() => {
                        setOnline(false);
                        console.warn('Flask backend unreachable — running in local fallback mode.');
                    });
            }, []);

            const pushAudit = (msg) => setAudit((a) => [{ t: clock(), msg }, ...a]);
            const pushConflict = (msg) => setConflictLog((c) => [{ t: clock(), msg }, ...c]);
            const flash = (r, okMsg) => setNotice(r.ok ? { ok: true, text: okMsg } : { ok: false, text: r.error });

            /* ---------- Role & Authentication Handling ---------- */
            const requestRoleSwitch = (targetRoleId) => {
                if (targetRoleId === 'student') {
                    setRole('student');
                    setNotice(null);
                    return;
                }
                if (auth[targetRoleId]) {
                    setRole(targetRoleId);
                    setNotice(null);
                } else {
                    setLoginModal(targetRoleId);
                }
            };

            const handleLogout = () => {
                setAuth((prev) => ({ ...prev, [role]: false }));
                setAuthProfile((prev) => {
                    const copy = { ...prev };
                    delete copy[role];
                    return copy;
                });
                setRole('student');
                flash({ ok: true }, 'Signed out. Returned to Guest Student Coordinator session.');
            };

            const executeLogin = async (targetRole, email, password) => {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role: targetRole, email, password }),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.ok) {
                        setAuth((prev) => ({ ...prev, [targetRole]: true }));
                        setAuthProfile((prev) => ({ ...prev, [targetRole]: data }));
                        setRole(targetRole);
                        setLoginModal(null);
                        flash({ ok: true }, `Authenticated as ${data.name || ROLES.find(r => r.id === targetRole).name}.`);
                        return { ok: true };
                    }
                    return { ok: false, error: data.error || 'Authentication rejected' };
                } catch (err) {
                    // Local fallback auth
                    const creds = {
                        faculty: { email: 'faculty@campus.edu', pass: 'faculty123', name: 'Dr. Faculty Advisor' },
                        admin: { email: 'admin@campus.edu', pass: 'admin123', name: 'Facilities Admin' },
                    };
                    const c = creds[targetRole];
                    if (c && email.trim().toLowerCase() === c.email.toLowerCase() && password === c.pass) {
                        setAuth((prev) => ({ ...prev, [targetRole]: true }));
                        setAuthProfile((prev) => ({ ...prev, [targetRole]: { name: c.name, email: c.email } }));
                        setRole(targetRole);
                        setLoginModal(null);
                        flash({ ok: true }, `Authenticated as ${c.name} (Local Mode).`);
                        return { ok: true };
                    }
                    return { ok: false, error: 'Invalid credentials. Please verify email and password.' };
                }
            };

            /* ---------- Remote / Local State Handlers ---------- */
            const handleCreateBooking = async (draft) => {
                try {
                    const res = await fetch(`${API_BASE}/bookings`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(draft),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (data.conflictLog) setConflictLog(data.conflictLog);
                    if (!res.ok || !data.ok) return { ok: false, error: data.error || 'Request failed' };
                    setBookings(data.bookings);
                    setAudit(data.audit);
                    return { ok: true, id: data.id };
                } catch (err) {
                    // Local fallback
                    const errs = validate(draft, bookings).filter((i) => i.level === 'error');
                    if (errs.length) {
                        if (errs.some((e) => e.text.startsWith('Time conflict')))
                            pushConflict(`Blocked new request "${draft.title || 'Untitled'}" (${venueOf(draft.venueId).name}, ${draft.date} ${draft.start}-${draft.end}): ${errs[0].text}`);
                        return { ok: false, error: errs[0].text };
                    }
                    const id = Math.max(100, ...bookings.map((b) => b.id)) + 1;
                    setBookings((b) => [...b, { ...draft, title: draft.title.trim(), id, attendees: Number(draft.attendees), status: 'PENDING_FACULTY', remark: '' }]);
                    pushAudit(`Request #${id} created as PENDING_FACULTY by Student Coordinator`);
                    return { ok: true, id };
                }
            };

            const handleTransition = async (id, to, actorRole, remark) => {
                try {
                    const res = await fetch(`${API_BASE}/bookings/${id}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ to, role: actorRole, remark: remark || '' }),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (data.conflictLog) setConflictLog(data.conflictLog);
                    if (!res.ok || !data.ok) return { ok: false, error: data.error || 'Transition failed' };
                    setBookings(data.bookings);
                    setAudit(data.audit);
                    return { ok: true };
                } catch (err) {
                    // Local fallback
                    const b = bookings.find((x) => x.id === id);
                    if (!b || !(TRANSITIONS[b.status]?.[actorRole] || []).includes(to))
                        return { ok: false, error: `Transition ${b?.status} -> ${to} is not allowed for role '${actorRole}'.` };
                    if (ACTIVE.includes(to)) {
                        const c = findConflicts(b, bookings, id);
                        if (c.length) {
                            const msg = `Cannot move #${id} to ${to}: overlaps #${c[0].id} "${c[0].title}" (${c[0].start}-${c[0].end}).`;
                            pushConflict(msg);
                            return { ok: false, error: msg };
                        }
                    }
                    const actor = ROLES.find((r) => r.id === actorRole).name;
                    setBookings((list) => list.map((x) => x.id === id ? { ...x, status: to, remark: remark || x.remark } : x));
                    pushAudit(`Request #${id} transitioned from ${b.status} -> ${to} by ${actor}${remark ? ` (remark: "${remark}")` : ''}`);
                    return { ok: true };
                }
            };

            const handleDeleteBooking = async (id) => {
                const b = bookings.find((x) => x.id === id);
                if (!b) return { ok: false, error: 'Booking not found.' };

                if (role === 'student' && !['PENDING_FACULTY', 'REJECTED'].includes(b.status)) {
                    return { ok: false, error: 'Students can only withdraw pending or rejected requests.' };
                }

                try {
                    const res = await fetch(`${API_BASE}/bookings/${id}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role }),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || !data.ok) return { ok: false, error: data.error || 'Deletion failed.' };
                    setBookings(data.bookings);
                    setAudit(data.audit);
                    if (data.conflictLog) setConflictLog(data.conflictLog);
                    return { ok: true };
                } catch (err) {
                    // Local fallback
                    setBookings((list) => list.filter((x) => x.id !== id));
                    const actor = ROLES.find((r) => r.id === role).name;
                    pushAudit(`Request #${id} ("${b.title}") deleted by ${actor}`);
                    return { ok: true };
                }
            };

            const handleResetData = async () => {
                try {
                    const res = await fetch(`${API_BASE}/reset`, { method: 'POST' });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.ok) {
                        setBookings(data.bookings);
                        setAudit(data.audit);
                        setConflictLog(data.conflictLog || []);
                        flash({ ok: true }, 'Demo dataset reset to pristine state.');
                        return;
                    }
                } catch (err) { }
                setBookings(SEED);
                setAudit(SEED_AUDIT);
                setConflictLog([]);
                flash({ ok: true }, 'Demo dataset reset to pristine state (local fallback).');
            };

                                        }
                                    }}
                                    className="space-y-4"
                                >
                                    <div id="login-error" className="text-xs text-rose-200 font-medium empty:hidden p-2.5 rounded bg-rose-500/15 border border-rose-500/40" />

                                    <Field label="Institutional Email">
                                        <input
                                            id="login-email"
                                            name="email"
                                            type="email"
                                            placeholder={loginModal === 'faculty' ? 'faculty@campus.edu' : 'admin@campus.edu'}
                                            required
                                        />
                                    </Field>

                                    <Field label="Role Password">
                                        <input
                                            id="login-pass"
                                            name="password"
                                            type="password"
                                            placeholder="••••••••"
                                            required
                                        />
                                    </Field>

                                    <div className="flex gap-2.5 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setLoginModal(null)}
                                            className="flex-1 py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 hover:bg-slate-800 text-slate-300 transition"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-2 px-3 rounded-xl text-xs font-semibold bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white transition shadow-md shadow-indigo-500/25 border border-indigo-400/40 active:scale-[0.98]"
                                        >
                                            Sign In & Authorize
                                        </button>
                                    </div>
                                </form>
                            </Card>
                        </div>
                    )}

                    {/* =====================================================================
          DELETE CONFIRMATION MODAL
          ===================================================================== */}
                    {deleteModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                            <Card className="w-full max-w-md p-6 space-y-4 border-slate-700 bg-slate-900 shadow-2xl">
                                <div className="flex items-center gap-3 text-rose-400 pb-2 border-b border-slate-800">
                                    <div className="p-2 rounded-xl bg-rose-500/20 border border-rose-500/40 shadow-sm">
                                        <Icon n="trash" s={20} />
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-white tracking-tight">Withdraw / Delete Request #{deleteModal.id}</h3>
                                        <span className="text-xs text-slate-300 font-medium">Permanent state removal</span>
                                    </div>
                                </div>

                                <div className="text-xs text-slate-200 space-y-2 bg-slate-950/80 p-3 rounded-xl border border-slate-700/80 shadow-sm">
                                    <div className="font-semibold text-white text-sm">{deleteModal.title}</div>
                                    <div className="text-slate-300 font-medium">{deleteModal.club} • {venueOf(deleteModal.venueId).name}</div>
                                    <div className="mono text-slate-200">{deleteModal.date} • {deleteModal.start}–{deleteModal.end}</div>
                                    <div className="pt-1"><Pill s={deleteModal.status} /></div>
                                </div>

                                <p className="text-xs text-slate-300 font-medium">
                                    Are you sure? This action will permanently remove this booking request and immediately free up any held venue time slots for other student chapters.
                                </p>

                                <div className="flex gap-2.5 pt-2">
                                    <button
                                        onClick={() => setDeleteModal(null)}
                                        className="flex-1 py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 hover:bg-slate-800 text-slate-300 transition"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={confirmDeleteBooking}
                                        className="flex-1 py-2 px-3 rounded-xl text-xs font-semibold bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-400 text-white transition shadow-md shadow-rose-500/25 border border-rose-400/40 active:scale-[0.98]"
                                    >
                                        Delete Request
                                    </button>
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
